<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增用户</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei";
        }
        body {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #0f172a);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            min-height:100vh;
            padding:60px 20px;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .wrap {
            max-width:480px;
            margin:0 auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,0.12);
            padding:48px;
            border-radius:18px;
            box-shadow:0 8px 32px rgba(0,0,0,0.35);
        }
        h2 {
            text-align:center;
            color:#f1f5f9;
            margin-bottom:34px;
            font-size:26px;
            text-shadow:0 0 8px rgba(56,189,248,0.3);
        }
        .item {
            margin-bottom:26px;
        }
        label {
            display:block;
            margin-bottom:9px;
            color:#cbd5e1;
        }
        input {
            width:100%;
            height:48px;
            padding:0 16px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:10px;
            font-size:16px;
            color:#fff;
        }
        input::placeholder{
            color:#94a3b8;
        }
        input:focus {
            outline:none;
            border-color:#34d399;
            box-shadow:0 0 0 3px rgba(52,211,153,0.2);
        }
        .submit-btn {
            width:100%;
            height:50px;
            background:linear-gradient(90deg,#059669,#34d399);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }
        .submit-btn:hover{
            box-shadow:0 0 15px rgba(52,211,153,0.35);
        }
        .back {
            display:block;
            text-align:center;
            margin-top:24px;
            color:#94a3b8;
            text-decoration:none;
        }
        .back:hover{
            color:#38bdf8;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h2>新增用户账号</h2>
    <form action="AddUserServlet" method="post">
        <div class="item">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="item">
            <label>登录密码</label>
            <input type="password" name="userpsw" placeholder="请输入密码" required>
        </div>
        <button class="submit-btn" type="submit">确认添加</button>
    </form>
    <a class="back" href="FindAllUserServlet">← 返回用户列表</a>
</div>
</body>
</html>
